name: build

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '30 03 01 */3 *' # Artifacts expire every 3 months

jobs:
  build:
    name: build with sm${{ matrix.sm_version }} on ${{ matrix.os_short }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-latest
          - windows-latest

        sm_version:
          # - "1.10"
          - "1.11"
          - "1.12"
          - "latest"

        sdk: [l4d2]
        sdk_branch: [l4d2-fork]

        include:

          # Use MM:Source 1.10 as base version
          - meta_version: "1.10"
            meta_branch: "1.10-dev"

          # - sm_version: "1.10"
          #   sm_branch: "1.10-dev"

          - sm_version: "1.11"
            sm_branch: "1.11-dev"
            meta_version: "1.11"
            meta_branch: "1.11-dev"

          - sm_version: "1.12"
            sm_branch: "1.12-dev"
            meta_version: "1.11"
            meta_branch: "1.11-dev"

          - sm_version: latest
            sm_branch: master
            meta_version: latest
            meta_branch: master

          - os: ubuntu-22.04
            os_short: oldlinux

          - os: ubuntu-latest
            os_short: linux

          - os: windows-latest
            os_short: win

    steps:
      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: checkout repo
        uses: actions/checkout@v4
        with:
          path: 'src'
          submodules: recursive

      - name: download ${{ matrix.sdk }} sdk
        uses: actions/checkout@v4
        with:
          repository: jensewe/hl2sdk
          ref: ${{ matrix.sdk_branch }}
          path: hl2sdk-${{ matrix.sdk }}

      - name: Getting SourceMod ${{ matrix.sm_version }}
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sm_branch }}
          path: sourcemod-${{ matrix.sm_version }}
          submodules: recursive

      - name: Getting MM:Source ${{ matrix.meta_version }}
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ matrix.meta_branch }}
          path: metamod-${{ matrix.meta_version }}

      - name: download ambuild
        uses: actions/checkout@v2
        with:
          repository: alliedmodders/ambuild
          path: 'ambuild'

      - name: install ambuild
        if: runner.os == 'Windows'
        run: |
          cd ambuild
          python setup.py install

      - name: install ambuild
        if: runner.os == 'Linux'
        run: |
          cd ambuild
          sudo python setup.py install

      - name: install linux packages
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt install -y g++-multilib clang
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: configure ambuild
        shell: bash
        working-directory: src
        run: |
          mkdir build
          cd build
          python ../configure.py \
          --sdks=${{ matrix.sdk }} \
          --sm-path="$GITHUB_WORKSPACE/sourcemod-${{ matrix.sm_version }}" \
          --mms-path="$GITHUB_WORKSPACE/metamod-${{ matrix.meta_version }}" \
          --targets=x86 \
          --enable-optimize

      - name: build
        working-directory: src/build
        run: |
          ambuild

      - name: upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom_fakelag-sm${{ matrix.sm_version }}-${{ matrix.os_short }}-${{ env.GITHUB_SHA_SHORT }}
          path: src/build/package/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          ls -Rall
          for folder in ${{ github.event.repository.name }}*; do
            if [ -d "$folder" ]; then
              echo "Processing folder: $folder"
              cd $folder
              tar -czf ../$folder.tar.gz -T <(\ls -1)
              cd ..
            fi
          done

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.tar.gz'
          tag: ${{ github.ref }}
          file_glob: true
